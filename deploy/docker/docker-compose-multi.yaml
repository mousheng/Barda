version: "3"
services:

  ##
  ## Start services required for Barda (MongoDB and Redis)
  ##
  mongodb:
    image: "mongo:4.4"
    container_name: mongodb
    environment:
      MONGO_INITDB_DATABASE: barda
      MONGO_INITDB_ROOT_USERNAME: barda
      MONGO_INITDB_ROOT_PASSWORD: secret123
    # Uncomment to save database data into local 'mongodata' folder
    # volumes:
    #   - ./mogodata:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis


  ##
  ## Start Barda backend services (api-service and node-service)
  ##
  barda-api-service:
    image: bardadev/barda-ce-api-service:latest
    container_name: barda-api-service
    # Enabled ports to be able to access backend from host
    # ports:
    #   - "8080:8080"
    environment:
      PUID: "9001"
      PGID: "9001"
      MONGODB_URI: "mongodb://barda:secret123@mongodb/barda?authSource=admin"
      REDIS_URL: "redis://redis:6379"
      JS_EXECUTOR_URI: "http://barda-node-service:6060"
      ENABLE_USER_SIGN_UP: "true"
      ENCRYPTION_PASSWORD: "barda.dev"
      ENCRYPTION_SALT: "barda.dev"
      CORS_ALLOWED_DOMAINS: "*"
      # RSA加密配置
      RSA_ENABLED: "true"
      # RSA密钥文件路径（可选，默认使用/barda-stacks/config/）
      # RSA_PUBLIC_KEY_PATH: "/barda-stacks/config/public.key"
      # RSA_PRIVATE_KEY_PATH: "/barda-stacks/config/private.key"
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis

  barda-node-service:
    image: bardadev/barda-ce-node-service:latest
    container_name: barda-node-service
    # Enabled ports to be able to access backend from host
    # ports:
    #   - "6060:6060"
    environment:
      PUID: "9001"
      PGID: "9001"
      BARDA_API_SERVICE_URL: "http://barda-api-service:8080"
    restart: unless-stopped
    depends_on:
      - barda-api-service

  ##
  ## Start Barda web frontend
  ##
  barda-frontend:
    image: bardadev/barda-ce-frontend:latest
    container_name: barda-frontend
    ports:
      - "3000:3000"
    environment:
      PUID: "9001"
      PGID: "9001"
      BARDA_API_SERVICE_URL: "http://barda-api-service:8080"
      BARDA_NODE_SERVICE_URL: "http://barda-node-service:6060"
    restart: unless-stopped
    depends_on:
      - barda-node-service
      - barda-api-service

