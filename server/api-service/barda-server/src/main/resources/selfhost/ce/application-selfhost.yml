common:
  encrypt:
    password: ${ENCRYPTION_PASSWORD:barda.com}
    salt: ${ENCRYPTION_SALT:barda.com}
  security:
    corsAllowedDomainString: ${CORS_ALLOWED_DOMAINS:*}
  workspace:
    mode: ENTERPRISE

auth:
  email:
    enable: ${LOGIN_CHANNEL_EMAIL:true}
    enable-register: ${ENABLE_USER_SIGN_UP:true}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/barda?socketTimeoutMS=5000}
    redis:
      url: ${REDIS_URL:redis://localhost:6379}